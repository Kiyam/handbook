[project]
site_name = "Handbook"
site_description = "Kiyam's personal notes and guides"
site_author = "Kiyam Lin"
site_url = "https://kiyam.github.io/handbook/"
repo_url = "https://github.com/Kiyam/handbook"
repo_name = "Kiyam/handbook"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Terminal" = [
    "terminal/index.md",
    { "Terminal setup" = "terminal/terminal-setup.md" },
  ] },
  { "Claude" = [
    "claude/index.md",
    { "Claude Code setup" = "claude/claude-code-setup.md" },
  ] },
  { "HPC" = ["hpc/index.md"] },
  { "Homelab" = ["homelab/index.md"] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
